# Runs on WKS01 and WKS02, while internet is still available (before testing).

- name: Tools folder
  ansible.windows.win_file:
    path: "{{ tenenbaum_tools_dir }}"
    state: directory

- name: Download the Sysinternals tools (pinned by checksum)
  ansible.windows.win_get_url:
    url: "{{ item.url }}"
    dest: '{{ tenenbaum_tools_dir }}\{{ item.name }}.zip'
    checksum: "{{ item.sha256 }}"
    checksum_algorithm: sha256
  loop: "{{ tenenbaum_sysinternals }}"
  loop_control:
    label: "{{ item.name }}"

- name: Extract the Sysinternals tools
  community.windows.win_unzip:
    src: '{{ tenenbaum_tools_dir }}\{{ item.name }}.zip'
    dest: "{{ tenenbaum_tools_dir }}"
    creates: '{{ tenenbaum_tools_dir }}\{{ item.creates }}'
  loop: "{{ tenenbaum_sysinternals }}"
  loop_control:
    label: "{{ item.name }}"

# --- Lab conditioning: let the attacker dump LSASS -------------------------
# Windows 11 22H2 runs LSASS as a protected process (RunAsPPL=2) by default,
# which blocks credential dumping even as SYSTEM. Turn it off so the lab is
# attackable. Documented in scenario/LAB-NOISE.md. Applies on next reboot
# (the workstation role reboots for autologon, so no extra reboot here).
- name: Disable LSASS protection (RunAsPPL) so LSASS can be dumped
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: RunAsPPL
    data: 0
    type: dword
