# Runs on the domain controller (DC01) only.
# Order matters: OUs -> groups -> users (a user can only join a group that exists).

- name: Build the domain DN from the FQDN (royal.tenenbaums -> DC=royal,DC=tenenbaums)
  ansible.builtin.set_fact:
    tenenbaum_domain_dn: "DC={{ tenenbaum_domain_fqdn.split('.') | join(',DC=') }}"

- name: Create the top-level OU
  microsoft.ad.ou:
    name: "{{ tenenbaum_ou_name }}"
    path: "{{ tenenbaum_domain_dn }}"
    state: present

- name: Create the sub-OUs
  microsoft.ad.ou:
    name: "{{ item }}"
    path: "OU={{ tenenbaum_ou_name }},{{ tenenbaum_domain_dn }}"
    state: present
  loop: "{{ tenenbaum_sub_ous }}"

- name: Create the groups
  microsoft.ad.group:
    name: "{{ item.name }}"
    description: "{{ item.desc }}"
    scope: global
    category: security
    path: "OU=Groups,OU={{ tenenbaum_ou_name }},{{ tenenbaum_domain_dn }}"
    state: present
  loop: "{{ tenenbaum_groups }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create the users
  microsoft.ad.user:
    name: "{{ item.name }}"
    sam_account_name: "{{ item.name }}"
    upn: "{{ item.name }}@{{ tenenbaum_domain_fqdn }}"
    firstname: "{{ item.first | default(omit, true) }}"
    surname: "{{ item.last | default(omit, true) }}"
    display_name: "{{ ((item.first | default('')) ~ ' ' ~ (item.last | default(''))) | trim | default(item.name, true) }}"
    description: "{{ item.desc }}"
    password: "{{ item.password }}"
    update_password: on_create        # set once; a rerun never resets the password
    password_never_expires: true
    enabled: true
    path: "OU={{ item.ou }},OU={{ tenenbaum_ou_name }},{{ tenenbaum_domain_dn }}"
    groups:
      add: "{{ item.groups }}"
    spn:
      add: "{{ item.spn | default([]) }}"
    state: present
  loop: "{{ tenenbaum_users }}"
  loop_control:
    label: "{{ item.name }}"          # print only the name, never the password

# --- Scenario: IT share with a script holding Pagoda's password --------------
- name: IT share folder
  ansible.windows.win_file:
    path: '{{ tenenbaum_it_share_path }}\scripts'
    state: directory

- name: Helpdesk drive-mapping script with hardcoded credentials
  ansible.windows.win_copy:
    dest: '{{ tenenbaum_it_share_path }}\{{ tenenbaum_leaked_script }}'
    content: |
      @echo off
      REM Helpdesk - map shared drives for new hires
      REM TODO: remove the hardcoded account before go-live
      net use H: \\DC01\{{ tenenbaum_it_share_name }} /user:ROYAL\{{ tenenbaum_leaked_creds_user }} {{ (tenenbaum_users | selectattr('name', 'equalto', tenenbaum_leaked_creds_user) | first).password }} /persistent:no
  no_log: true

- name: Publish the IT share (readable by every domain user)
  ansible.windows.win_share:
    name: "{{ tenenbaum_it_share_name }}"
    path: "{{ tenenbaum_it_share_path }}"
    description: "IT scripts and installers"
    list: true
    read: "ROYAL\\Domain Users"
    full: "ROYAL\\Domain Admins,ROYAL\\Helpdesk"
    state: present

# --- Scenario: the trophy the attacker exfiltrates from DC01 ------------------
- name: Trophy folder
  ansible.windows.win_file:
    path: "{{ tenenbaum_trophy_path | win_dirname }}"
    state: directory

- name: The trophy file (fake sensitive data)
  ansible.windows.win_copy:
    dest: "{{ tenenbaum_trophy_path }}"
    content: |
      TENENBAUM HOLDINGS - CONFIDENTIAL
      Q4 acquisition targets and board memo. Do not distribute.
      (Lab trophy file - fake data for the FOR intrusion dataset.)
