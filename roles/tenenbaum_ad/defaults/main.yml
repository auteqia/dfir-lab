# --- Scenario: credentials left in a file (ATT&CK T1552.001) -----------------
# The Helpdesk left a drive-mapping script with Pagoda's password on the IT
# share. Any domain user can read it: this is how the attacker gets from
# Henry (no admin anywhere) to Pagoda (local admin on the workstations).
