# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
# Tenenbaum DFIR lab – full range. Apply with: ludus range config set -f range/range.yaml
#
# A role must be uploaded before it is listed here:
#   ludus ansible role add -d roles/<role> --force
# Roles still commented out are not written yet.

defaults:
  snapshot_with_RAM: true        # testing-mode snapshots keep RAM (checkpoint "rewind" button)

ludus:
  - vm_name: "auteqia-DC01"
    hostname: "DC01"
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 11
    ram_gb: 10
    cpus: 4
    windows:
      sysprep: false
      gpos:
        - disable_defender    # Ludus native GPO: turns Defender off domain-wide (lab noise, see LAB-NOISE.md)
    domain:
      fqdn: royal.tenenbaums
      role: primary-dc
    testing:
      snapshot: true
      block_internet: true
    # roles ansible to apply to this vm
    roles:
      - tenenbaum_logging
      - tenenbaum_ad

  - vm_name: "auteqia-WKS01"         # patient zero, opens the lure
    hostname: "WKS01"
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 21
    ram_gb: 6
    cpus: 4
    windows:
      chocolatey_packages:
        - googlechrome
      chocolatey_ignore_checksums: true   # Chrome updates faster than the choco package hash
      office_version: 2021
      office_arch: 64bit
    domain:
      fqdn: royal.tenenbaums
      role: member
    testing:
      snapshot: true
      block_internet: true
    roles:
      - tenenbaum_logging
      - tenenbaum_tooling
      - name: tenenbaum_workstation
        depends_on:
          - { vm_name: "auteqia-DC01", role: tenenbaum_ad }   # Helpdesk group must exist first
    role_vars:
      tenenbaum_autologon_user: "ROYAL\\henry.sherman"
      tenenbaum_autologon_password: "Accounting#1965"

  - vm_name: "auteqia-WKS02"         # lateral movement target, DA session cached
    hostname: "WKS02"
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 22
    ram_gb: 6
    cpus: 4
    windows: {}                      # required: marks the VM as Windows (no Office/Chrome here)
    domain:
      fqdn: royal.tenenbaums
      role: member
    testing:
      snapshot: true
      block_internet: true
    roles:
      - tenenbaum_logging
      - tenenbaum_tooling
      - name: tenenbaum_workstation
        depends_on:
          - { vm_name: "auteqia-DC01", role: tenenbaum_ad }
    role_vars:
      tenenbaum_autologon_user: "ROYAL\\royal.tenenbaum"
      tenenbaum_autologon_password: "Lindbergh!Palace375"

  - vm_name: "auteqia-kali"
    hostname: "kali"
    template: kali-x64-desktop-template
    vlan: 99
    ip_last_octet: 1
    ram_gb: 8
    cpus: 4
    linux: true
    # The attacker's fake "supplier" site resolves to Kali so the lure download
    # carries a real hostname → Mark-of-the-Web / Zone.Identifier + Chrome history + Sysmon 22 DNS.
    dns_rewrites:
      - "lindbergh-supplies.com"
      - "*.lindbergh-supplies.com"
    testing:
      snapshot: false
      block_internet: false

network:
  inter_vlan_default: REJECT
  rules:
    - name: Windows to kali 80
      vlan_src: 10
      vlan_dst: 99
      protocol: tcp
      ports: 80
      action: ACCEPT
    - name: Windows to kali 443
      vlan_src: 10
      vlan_dst: 99
      protocol: tcp
      ports: 443
      action: ACCEPT
    - name: Windows to kali 8080
      vlan_src: 10
      vlan_dst: 99
      protocol: tcp
      ports: 8080
      action: ACCEPT
    - name: Kali to all windows
      vlan_src: 99
      vlan_dst: 10
      protocol: all
      ports: all
      action: ACCEPT
